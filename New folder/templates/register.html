{% extends 'base.html' %}

{% block title %}Register - InterviewPrepAI{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg glass-card text-white p-4">
            <div class="text-center mb-4">
                <h2 class="fw-bold">Create Account</h2>
                <p class="text-muted">Start your personalized interview preparation journey</p>
            </div>
            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-person"></i></span>
                        <input type="text" name="name" class="form-control bg-dark text-white border-secondary" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control bg-dark text-white border-secondary" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Target Job Role</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-briefcase"></i></span>
                        <select name="target_role_id" class="form-select bg-dark text-white border-secondary">
                            <option value="">Select Target Role</option>
                            {% for role in job_roles %}
                            <option value="{{ role.id }}">{{ role.title }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-shield-lock"></i></span>
                        <input type="password" name="confirm_password" class="form-control bg-dark text-white border-secondary" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gradient w-100 py-2 rounded-3 fw-bold">Register Account</button>
            </form>

            <div class="text-center mt-4">
                <small class="text-muted">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-gradient fw-bold">Login here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
