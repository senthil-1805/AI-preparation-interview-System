{% extends 'base.html' %}

{% block title %}Login - InterviewPrepAI{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg glass-card text-white p-4">
            <div class="text-center mb-4">
                <h2 class="fw-bold">Welcome Back</h2>
                <p class="text-muted">Login to access your AI interview workspace</p>
            </div>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control bg-dark text-white border-secondary" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gradient w-100 py-2 rounded-3 fw-bold">Sign In</button>
            </form>

            <div class="text-center mt-4">
                <small class="text-muted">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-gradient fw-bold">Register now</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
